readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "beanie>=2.0.0",
    "certifi>=2025.10.5",
    "fastapi>=0.120.4",
    "motor>=3.7.1",
    "pydantic[email]>=2.12.3",
    "pydantic-settings>=2.1.0",
    "python-dotenv>=1.2.1",
    "uvicorn[standard]>=0.27.0",
    "passlib[bcrypt]==1.7.4",
    "bcrypt==4.0.1",
    "python-jose[cryptography]>=3.3.0",
    "pymongo>=4.15.3",
    "python-multipart>=0.0.20",
]